<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">

  <!-- Céu de fundo -->
  <rect width="1200" height="700" fill="url(#skyGrad)" />

  <defs>
    <!-- Gradiente do céu -->
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#6fb3ff"/>
    </linearGradient>

    <!-- Gradiente das chamas -->
    <linearGradient id="flameGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff29a"/>
      <stop offset="0.3" stop-color="#ffea5a"/>
      <stop offset="0.6" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#b31900"/>
    </linearGradient>

    <!-- Forma do ônibus (simples) -->
    <g id="bus">
      <rect x="0" y="0" width="200" height="80" rx="20" ry="20" fill="#333" />
      <rect x="20" y="20" width="160" height="40" fill="#111" />
      <circle cx="40" cy="80" r="15" fill="#000" />
      <circle cx="160" cy="80" r="15" fill="#000" />
    </g>
  </defs>

  <!-- Ônibus escondido atrás das chamas -->
  <g transform="translate(400,300)">
    <use href="#bus" />
  </g>

  <!-- Chamas frontais cobrindo o ônibus -->
  <g>
    <path d="M400 300 
             c-30 -60 50 -100 80 -20 
             c20 -40 60 -60 50 20 
             c30 -50 60 -40 40 30 
             c10 -40 70 -50 30 40"
          fill="url(#flameGrad)" opacity="0.9"/>
    <path d="M410 320
             c-25 -50 45 -90 70 -15
             c15 -35 55 -55 45 15
             c25 -45 55 -35 35 25
             c10 -35 65 -45 25 35"
          fill="url(#flameGrad)" opacity="0.7"/>
  </g>

</svg>
